# Local PostgreSQL validation; public HTTPS deployment is separate.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8010:8010"
    environment:
      DITTO_DATABASE_URL: postgresql+psycopg://ditto:${DITTO_POSTGRES_PASSWORD:?Set a private database password}@db:5432/ditto
      DITTO_DEMO_MODE: "false"
      DITTO_MEDIA_ROOT: /data/media
    volumes:
      - ditto-media:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ditto
      POSTGRES_PASSWORD: ${DITTO_POSTGRES_PASSWORD:?Set a private database password}
      POSTGRES_DB: ditto
    volumes:
      - ditto-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ditto -d ditto"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  ditto-media:
  ditto-pg:
